# Rydder maskinelle grener.
#
# etl.yml og etl-statisk.yml lager en ny gren ved hver kjøring, og den blir
# liggende etter at pull requesten er slått sammen eller lukket. Uten en
# opprydder vokser listen for hver kjøring, og det blir uklart hvilke som
# fortsatt betyr noe.
#
# Regelen er at en maskinell gren uten åpen pull request er ferdig: enten er
# den slått sammen, eller så er den forkastet. Grener med åpen pull request
# røres aldri.
#
# Kjøringen er tørr som standard. Den lister hva den ville slettet, og sletter
# ingenting før den kjøres med slett = true.

name: Rydd maskinelle grener

on:
  workflow_dispatch:
    inputs:
      slett:
        description: "Slett grenene. Er den av, listes de bare opp"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: rydd-grener
  cancel-in-progress: false

jobs:
  rydd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finn og rydd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLETT: ${{ inputs.slett }}
        run: |
          set -euo pipefail

          # Kun grener workflowene selv har laget. Mønsteret er bevisst smalt:
          # alt annet, inkludert utviklingsgrener, holdes utenfor.
          kandidater="$(git ls-remote --heads origin 'refs/heads/etl/*' \
            | sed 's|.*refs/heads/||')"

          if [ -z "$kandidater" ]; then
            echo "Ingen maskinelle grener å rydde."
            exit 0
          fi

          igjen=0
          for gren in $kandidater; do
            aapne="$(gh pr list --head "$gren" --state open --json number --jq 'length')"
            if [ "$aapne" != "0" ]; then
              echo "beholdes  $gren — har åpen pull request"
              igjen=$((igjen + 1))
              continue
            fi

            if [ "$SLETT" = "true" ]; then
              git push origin --delete "$gren"
              echo "slettet   $gren"
            else
              echo "ville slettet  $gren"
            fi
          done

          if [ "$SLETT" != "true" ]; then
            echo
            echo "::notice::Tørrkjøring. Kjør på nytt med «slett» slått på for å slette."
          fi
          echo "Grener med åpen pull request som ble beholdt: $igjen"
