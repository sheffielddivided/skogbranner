# Engangsverktøy: kjører den fulle pipelinen i Actions, der utgående trafikk er
# åpen og tunge jobber hører hjemme (CLAUDE.md T4).
#
# Utviklingsmiljøets nettverkspolicy avviser api2.effis.emergency.copernicus.eu,
# så K2 og K3 kan ikke kjøres derfra i det hele tatt, og hele løpet er uansett
# for tungt for en utviklingssesjon. Jobben henter derfor alle kildene, skriver
# de bearbeidede filene og committer dem tilbake til grenen.
#
# Slettes sammen med scripts/inspiser_kilder.py før grenen slås sammen med main.
# Den månedlige kjøringen ligger i etl.yml og er det som gjelder videre.

name: Kjør pipelinen på grenen

on:
  push:
    branches: [claude/add-sources-k2-k3-k5-k6-k7-gg8y9l]
    # Bare når koden endres. Et commit av datafilene skal ikke utløse en ny
    # kjøring, som ville utløst en ny igjen.
    paths:
      - etl/**
      - scripts/inspiser_kilder.py
      - requirements.txt
      - package-lock.json
      - .github/workflows/inspiser.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspiser
  cancel-in-progress: false

jobs:
  kilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # K6 bruker mapshaper til forenkling og arealberegning.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Navnekilden først: normalize.py slår opp norske navn i land_no.json.
      - name: Navnekilde — SSB Klass
        run: python -m etl.sources.ssb_klass

      - name: Hele pipelinen
        run: python -m etl.run

      - name: Avviksrapporten K1 mot K2
        if: always()
        run: cat data/raw/kryssjekk_k1_k2.md || echo "ingen rapport"

      - name: Commit de bearbeidede filene
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Eksplisitte stier. data/raw/ er gitignorert og skal aldri
          # committes (T4).
          git add data/processed data/geo data/_sources.json data/_status.json

          if git diff --cached --quiet; then
            echo "ingen endringer"
          else
            git diff --cached --stat
            git commit -m "ETL: kjør de nye kildene og skriv datasettet"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
