# Engangsverktøy: kjører den månedlige pipelinen i Actions og committer
# resultatet til grenen. Kildevertene til K2, K3 og K4 er blokkert av
# utviklingsmiljøets nettverkspolicy, så løpet kan ikke kjøres derfra (T4).
#
# Slettes før grenen slås sammen med main.

name: Kjør pipelinen på grenen

on:
  push:
    branches: [claude/add-sources-k2-k3-k5-k6-k7-gg8y9l]
    paths:
      - etl/**
      - requirements.txt
      - .github/workflows/inspiser.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inspiser
  cancel-in-progress: false

jobs:
  kilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Navnekilde — SSB Klass
        run: python -m etl.sources.ssb_klass

      - name: Hele pipelinen
        id: etl
        continue-on-error: true
        run: python -m etl.run

      - name: Avviksrapporten K1 mot K2
        if: always()
        run: cat data/raw/kryssjekk_k1_k2.md || echo "ingen rapport"

      - name: Commit de bearbeidede filene
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/geo data/_sources.json data/_status.json
          if git diff --cached --quiet; then
            echo "ingen endringer"
          else
            git diff --cached --stat
            git commit -m "ETL: f_product_level på K1 og K4, kryssjekk kun på fullstendige år"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Marker kjøringen som feilet
        if: steps.etl.outcome == 'failure'
        run: |
          echo "::error::En kilde feilet. Se loggen over."
          exit 1
