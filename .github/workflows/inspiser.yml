# Engangsverktøy: kartlegger et kildeformat i Actions, der utgående trafikk er
# åpen og en tung fil kan lastes ned. Utviklingsmiljøets nettverkspolicy
# avviser enkelte kildeverter, og en parser skal ikke skrives mot en antatt
# struktur.
#
# Slettes sammen med scripts/inspiser_kilder.py før grenen slås sammen med main.

name: Inspiser kildeformat

on:
  push:
    branches: [claude/add-sources-k2-k3-k5-k6-k7-gg8y9l]
    paths:
      - scripts/inspiser_kilder.py
      - .github/workflows/inspiser.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kilder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.inspiser_kilder
